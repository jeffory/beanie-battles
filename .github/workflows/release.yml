name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Go Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libgl1-mesa-dev xorg-dev

      - name: Build binaries
        run: |
          mkdir -p dist

          # Windows builds
          GOOS=windows GOARCH=amd64 go build -o dist/beanie-battles-windows-amd64.exe || true
          GOOS=windows GOARCH=arm64 go build -o dist/beanie-battles-windows-arm64.exe || true

          # Linux builds
          GOOS=linux GOARCH=amd64 go build -o dist/beanie-battles-linux-amd64 || true

          # macOS builds
          GOOS=darwin GOARCH=amd64 go build -o dist/beanie-battles-mac-amd64 || true
          GOOS=darwin GOARCH=arm64 go build -o dist/beanie-battles-mac-arm64 || true


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
